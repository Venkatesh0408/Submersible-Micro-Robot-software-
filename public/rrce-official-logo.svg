<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <style>
      .gear-tooth { fill: #2B185A; }
      .yellow-ring { fill: #FFEB3B; stroke: #2B185A; stroke-width: 3.5; }
      .inner-cream { fill: #FFFDF0; stroke: #2B185A; stroke-width: 3.5; }
      .top-title { font-family: 'Arial', 'Helvetica', sans-serif; font-weight: 900; font-size: 15.5px; fill: #1D0A42; letter-spacing: 0.8px; }
      .bottom-city { font-family: 'Arial', 'Helvetica', sans-serif; font-weight: 900; font-size: 18px; fill: #D32F2F; letter-spacing: 1.5px; }
      .ribbon-fill { fill: #361B6B; stroke: #1C0B3E; stroke-width: 3; }
      .ribbon-dark { fill: #220F47; stroke: #1C0B3E; stroke-width: 2.5; }
      .ribbon-title { font-family: 'Arial', 'Helvetica', sans-serif; font-weight: 900; font-size: 20px; fill: #FFFFFF; letter-spacing: 2px; }
      .icon-dark { fill: #2B185A; }
      .icon-line { stroke: #2B185A; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>

    <!-- Top Text Arc (Clockwise from Left to Right over top) -->
    <path id="arcTopText" d="M 108,200 A 142,142 0 0,1 392,200" fill="none" />
    
    <!-- Bottom Text Arc (Clockwise from Right to Left under bottom) -->
    <path id="arcBottomText" d="M 375,200 A 125,125 0 0,1 125,200" fill="none" />
  </defs>

  <!-- Outer Gear Wheel (Center at 250, 195) -->
  <g transform="translate(250, 195)">
    <!-- 20 Gear Cogs -->
    <g class="gear-tooth">
      <rect x="-11" y="-178" width="22" height="26" rx="2" transform="rotate(0)" />
      <rect x="-11" y="-178" width="22" height="26" rx="2" transform="rotate(18)" />
      <rect x="-11" y="-178" width="22" height="26" rx="2" transform="rotate(36)" />
      <rect x="-11" y="-178" width="22" height="26" rx="2" transform="rotate(54)" />
      <rect x="-11" y="-178" width="22" height="26" rx="2" transform="rotate(72)" />
      <rect x="-11" y="-178" width="22" height="26" rx="2" transform="rotate(90)" />
      <rect x="-11" y="-178" width="22" height="26" rx="2" transform="rotate(108)" />
      <rect x="-11" y="-178" width="22" height="26" rx="2" transform="rotate(126)" />
      <rect x="-11" y="-178" width="22" height="26" rx="2" transform="rotate(144)" />
      <rect x="-11" y="-178" width="22" height="26" rx="2" transform="rotate(162)" />
      <rect x="-11" y="-178" width="22" height="26" rx="2" transform="rotate(180)" />
      <rect x="-11" y="-178" width="22" height="26" rx="2" transform="rotate(198)" />
      <rect x="-11" y="-178" width="22" height="26" rx="2" transform="rotate(216)" />
      <rect x="-11" y="-178" width="22" height="26" rx="2" transform="rotate(234)" />
      <rect x="-11" y="-178" width="22" height="26" rx="2" transform="rotate(252)" />
      <rect x="-11" y="-178" width="22" height="26" rx="2" transform="rotate(270)" />
      <rect x="-11" y="-178" width="22" height="26" rx="2" transform="rotate(288)" />
      <rect x="-11" y="-178" width="22" height="26" rx="2" transform="rotate(306)" />
      <rect x="-11" y="-178" width="22" height="26" rx="2" transform="rotate(324)" />
      <rect x="-11" y="-178" width="22" height="26" rx="2" transform="rotate(342)" />
    </g>

    <!-- Outer Yellow Ring -->
    <circle cx="0" cy="0" r="162" class="yellow-ring" />

    <!-- Inner Cream Circle -->
    <circle cx="0" cy="0" r="102" class="inner-cream" />
  </g>

  <!-- Curvaceous Text -->
  <text class="top-title">
    <textPath href="#arcTopText" startOffset="50%" text-anchor="middle">
      RAJARAJESWARI COLLEGE OF ENGINEERING
    </textPath>
  </text>

  <text class="bottom-city">
    <textPath href="#arcBottomText" startOffset="50%" text-anchor="middle">
      BANGALORE
    </textPath>
  </text>

  <!-- Central Emblems (Center at 250, 195) -->
  <g transform="translate(250, 195)">
    <!-- Top-Left: Computer Monitor & CPU -->
    <g transform="translate(-54, -52)">
      <!-- PC Monitor -->
      <rect x="0" y="0" width="36" height="26" rx="3" fill="#FFFFFF" class="icon-line" />
      <rect x="4" y="4" width="28" height="18" fill="#FFFDF0" stroke="#2B185A" stroke-width="1.5" />
      <circle cx="18" cy="13" r="5" fill="#2B185A" />
      <!-- Stand -->
      <path d="M 12,26 L 24,26 M 18,26 L 18,32 M 8,32 L 28,32" class="icon-line" stroke-width="2.5" />
      <!-- CPU Case -->
      <rect x="40" y="8" width="18" height="25" rx="2" fill="#FFFFFF" class="icon-line" />
      <line x1="44" y1="14" x2="52" y2="14" class="icon-line" stroke-width="2" />
      <line x1="44" y1="18" x2="52" y2="18" class="icon-line" stroke-width="2" />
      <circle cx="48" cy="25" r="2" fill="#2B185A" />
    </g>

    <!-- Top-Right: Lightning Bolt -->
    <g transform="translate(28, -55)">
      <polygon points="18,0 0,22 13,22 4,44 26,18 13,18" fill="#2B185A" />
    </g>

    <!-- Center: Traditional Diya Lamp -->
    <g transform="translate(-14, -12)">
      <!-- Flame -->
      <path d="M 14,0 C 22,10 20,18 14,24 C 8,18 6,10 14,0 Z" fill="#E65100" />
      <path d="M 14,6 C 18,12 17,17 14,21 C 11,17 10,12 14,6 Z" fill="#FFD600" />
      <!-- Lamp Base -->
      <path d="M 0,26 C 2,36 26,36 28,26 Z" fill="#2B185A" />
      <rect x="10" y="34" width="8" height="4" fill="#2B185A" />
    </g>

    <!-- Bottom-Left: Interlocking Engineering Gears -->
    <g transform="translate(-52, 22)">
      <circle cx="16" cy="16" r="14" class="icon-line" stroke-width="3" />
      <circle cx="16" cy="16" r="5" fill="#2B185A" />
      <path d="M 16,0 L 16,32 M 0,16 L 32,16 M 5,5 L 27,27 M 5,27 L 27,5" class="icon-line" stroke-width="3" />
      
      <circle cx="34" cy="30" r="10" class="icon-line" stroke-width="2.5" />
      <circle cx="34" cy="30" r="3.5" fill="#2B185A" />
      <path d="M 34,18 L 34,42 M 22,30 L 46,30" class="icon-line" stroke-width="2.5" />
    </g>

    <!-- Bottom-Right: Satellite Dish Antenna -->
    <g transform="translate(18, 18)">
      <!-- Dish Curve -->
      <path d="M 0,28 C 10,10 30,10 38,26" class="icon-line" stroke-width="4" />
      <!-- Stand -->
      <line x1="18" y1="24" x2="10" y2="40" class="icon-line" stroke-width="3" />
      <line x1="20" y1="24" x2="28" y2="40" class="icon-line" stroke-width="3" />
      <line x1="4" y1="40" x2="34" y2="40" class="icon-line" stroke-width="3" />
      <!-- Feed Horn -->
      <line x1="18" y1="20" x2="26" y2="8" class="icon-line" stroke-width="2.5" />
      <circle cx="28" cy="6" r="3" fill="#2B185A" />
    </g>
  </g>

  <!-- Bottom Ribbon Banner: "KNOWLEDGE IS POWER" -->
  <g transform="translate(0, 375)">
    <!-- Left Ribbon Tail -->
    <polygon points="50,25 90,0 90,45 50,55 65,38" class="ribbon-dark" />
    <!-- Right Ribbon Tail -->
    <polygon points="450,25 410,0 410,45 450,55 435,38" class="ribbon-dark" />

    <!-- Ribbon Folds -->
    <polygon points="90,45 110,25 110,45" class="ribbon-dark" />
    <polygon points="410,45 390,25 390,45" class="ribbon-dark" />

    <!-- Main Ribbon Body -->
    <path d="M 85,15 C 250,30 250,30 415,15 L 420,52 C 250,70 250,70 80,52 Z" class="ribbon-fill" />

    <!-- Ribbon Text -->
    <text x="250" y="44" text-anchor="middle" class="ribbon-title">KNOWLEDGE IS POWER</text>
  </g>
</svg>
